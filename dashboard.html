<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SAMSUNG SDS · WH Dashboard</title>
<link rel="icon" href="icon.svg?v=4" type="image/svg+xml">
<style>
  /* Trang chọn bảng (landing): bấm vào thẻ nào thì mở thẳng trang đó. Mỗi bảng vẫn là trang riêng (tv.html, sorting.html, productivity.html). */
  :root{--blue:#1428A0;--bar:#1F5FD8;--navy:#0b1f6b;--line:#D1D5DB;--ink:#111827;--muted:#4B5563}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#F3F5FA;font-family:"Segoe UI",Arial,Helvetica,sans-serif;color:var(--ink)}
  .head{display:flex;height:56px;border-bottom:2px solid var(--navy);background:#fff}
  .logo{flex:0 0 auto;display:flex;align-items:center;padding:0 20px;color:var(--blue);font-size:22px;font-weight:900;letter-spacing:.02em}
  .title{flex:1;display:flex;align-items:center;padding:0 20px;background:var(--bar);color:#fff;font-size:20px;font-weight:800;letter-spacing:.02em}
  main{max-width:920px;margin:0 auto;padding:40px 16px 24px}
  h1{margin:0 0 6px;font-size:26px;color:var(--blue)}
  .sub{margin:0 0 28px;color:var(--muted);font-size:15px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
  .card{display:flex;flex-direction:column;gap:8px;padding:26px 24px;background:#fff;border:1px solid var(--line);border-top:6px solid var(--bar);border-radius:10px;
    color:inherit;text-decoration:none;box-shadow:0 1px 3px rgba(17,24,39,.08);transition:transform .12s,box-shadow .12s}
  a.card:hover,a.card:focus-visible{transform:translateY(-3px);box-shadow:0 8px 20px rgba(20,40,160,.18);outline:none}
  .card .k{color:var(--blue);font-size:13px;font-weight:800;letter-spacing:.06em}
  .card .n{font-size:30px;font-weight:900}
  .card .d{color:var(--muted);font-size:15px;line-height:1.45}
  .card .go{margin-top:10px;color:var(--bar);font-weight:800;font-size:15px}
  .card.off{border-top-color:#9CA3AF;opacity:.6}
  .card.off .go{color:var(--muted)}
  .foot{max-width:920px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="head"><div class="logo">SAMSUNG SDS</div><div class="title">WH Dashboard</div></div>
<main>
  <h1>Chọn bảng cần xem</h1>
  <p class="sub">Bấm vào một thẻ để mở bảng đó. Muốn quay lại đây thì bấm nút Back của trình duyệt.</p>
  <div class="cards" id="cards"></div>
</main>
<div class="foot">SAMSUNG SDS · SDS-GS25 Binh Dien Warehouse</div>
<script>
'use strict';
// Link chung:  dashboard.html#key=<key Sorting>&mkey=<key Mover>[&lang=vi|en|ko][&all=1]
// - key  : DASH_KEY của proxy Sorting (mở bảng SORTING)
// - mkey : DASH_KEY của proxy Mover (mở bảng MOVER). Bỏ trống thì dùng key chung.
// - lang : ngôn ngữ của bảng Sorting.
// - all=1: hiện thêm thẻ MOVER Productivity (có tên và thời gian từng người, mặc định ẩn).
// Key nằm sau dấu # nên không gửi lên server khi tải trang. Chỉ chia sẻ link này cho người được phép xem.
const h = new URLSearchParams(location.hash.replace(/^#/, ''));
// Nhớ key trong tab này (sessionStorage): từ bảng bấm chữ SAMSUNG SDS về trang chủ thì không mất key của bảng kia.
let saved = {};
try { saved = JSON.parse(sessionStorage.getItem('dashKeys') || '{}'); } catch (e) { /* bị chặn thì bỏ qua */ }
const key = h.get('key') || saved.key || '', mkey = h.get('mkey') || saved.mkey || key, lang = h.get('lang') || saved.lang || '';
const all = h.get('all') === '1' || !!saved.all;
try { sessionStorage.setItem('dashKeys', JSON.stringify({ key: h.get('key') || saved.key || '', mkey: h.get('mkey') || saved.mkey || '', lang, all })); } catch (e) { /* không lưu được thì thôi */ }
const enc = encodeURIComponent;

const ITEMS = [
  { k: 'MOVER', n: 'Progress', d: 'Tiến độ điều hàng hôm nay: Actual / Plan, hàng chờ còn lại, sản lượng từng nhân viên.',
    href: mkey ? 'tv.html#key=' + enc(mkey) : '', need: 'mkey' },
  { k: 'SORTING', n: 'Productivity', d: 'Năng suất sorting theo nhân viên, theo giờ và theo Zone / Line. Chọn ngày, tải Excel.',
    href: key ? 'sorting.html' + (lang ? '?lang=' + enc(lang) : '') + '#key=' + enc(key) : '', need: 'key' },
];
if (all) ITEMS.push({ k: 'MOVER', n: 'Productivity', d: 'Năng suất mover theo người (có tên và thời gian). Chỉ dành cho quản lý.',
  href: mkey ? 'productivity.html#key=' + enc(mkey) : '', need: 'mkey' });

document.getElementById('cards').innerHTML = ITEMS.map(i => {
  const body = `<div class="k">${i.k}</div><div class="n">${i.n}</div><div class="d">${i.d}</div>`;
  return i.href
    ? `<a class="card" href="${i.href}">${body}<div class="go">Mở bảng →</div></a>`
    : `<div class="card off">${body}<div class="go">Thiếu khoá: thêm #${i.need}=... vào link</div></div>`;
}).join('');
</script>
</body>
</html>
